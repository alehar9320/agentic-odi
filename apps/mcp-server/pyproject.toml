[project]
name = "agentic-odi-mcp-server"
version = "0.14.0"
description = "FastMCP server for Agentic ODI."
requires-python = ">=3.10"
dependencies = [
    # Query-parameter resource templates need 2.13+; pin the major we test.
    "fastmcp>=4.1,<5",
    "pydantic",
    "agentic-odi-core",
]

[tool.uv.sources]
agentic-odi-core = { workspace = true }

[project.scripts]
agentic-odi-server = "agentic_odi_mcp_server.mcp_server:main"
agentic-odi-mcp-server = "agentic_odi_mcp_server.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_odi_mcp_server"]
