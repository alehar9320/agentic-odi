<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0b0e" />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-title" content="Living Studio" />
    <title>Living Studio</title>
    <!-- The boot shell and the theme resolution ship as same-origin files
         (`public/boot.css`, `public/boot-theme.js`), not as inline blocks: the
         sidecar and the Tauri window serve this document under a strict CSP
         (`script-src 'self'; style-src 'self'`), which refuses inline script
         and inline style. Loading them from <head> keeps the ordering — the
         sheet paints before the bundle parses and the script resolves the
         theme before React runs — while staying inside the policy.
         The colours are copies of --bg/--line in src/styles/theme.css, which
         stays the source of truth; bootShell.test.ts fails if they drift. -->
    <link rel="stylesheet" href="/boot.css" />
    <script src="/boot-theme.js"></script>
  </head>
  <body>
    <div id="root">
      <div id="boot" class="boot-shell" aria-hidden="true">
        <div class="boot-shell__bar"></div>
        <div class="boot-shell__rail"></div>
        <div class="boot-shell__stage"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
