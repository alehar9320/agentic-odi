[package]
name = "agentic-odi-studio"
version = "0.14.0"
description = "Agentic ODI Living Studio desktop shell"
authors = ["Agentic ODI"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "agentic_odi_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
