<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0b0e" />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-title" content="Living Studio" />
    <title>Living Studio</title>
    <style>
      :root {
        --boot-bg: #0a0b0e;
        --boot-line: rgba(255, 255, 255, 0.07);
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        html:not(.theme-light) {
          --boot-bg: #f5f6f8;
          --boot-line: rgba(15, 23, 42, 0.09);
          color-scheme: light;
        }
      }
      html.theme-light {
        --boot-bg: #f5f6f8;
        --boot-line: rgba(15, 23, 42, 0.09);
        color-scheme: light;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--boot-bg);
      }
      #splash-root {
        height: 100%;
      }
    </style>
    <script>
      (function () {
        var theme = null;
        try {
          var stored = JSON.parse(window.localStorage.getItem("studio.settings") || "null");
          if (stored && (stored.theme === "light" || stored.theme === "dark")) theme = stored.theme;
        } catch (error) {}
        if (!theme) {
          var light =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: light)").matches;
          theme = light ? "light" : "dark";
        }
        var root = document.documentElement;
        root.classList.add(theme === "light" ? "theme-light" : "theme-dark");
        root.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="splash-root"></div>
    <script type="module" src="/src/splashscreen/main.tsx"></script>
  </body>
</html>
