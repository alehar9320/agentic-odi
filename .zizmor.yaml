# .zizmor.yaml
# Triaged configuration for the `workflow-analysis` CI gate (PR #1271).
#
# The repository pins Actions by tag (e.g. `actions/checkout@v7`) rather than
# by commit SHA. Migrating every reference across all workflows to a SHA is a
# separate effort, so `unpinned-uses` is scoped out here.
#
# `excessive-permissions` is scoped out because the Pages, release and Tauri
# release workflows intentionally request broad workflow-level permissions
# (pages: write, id-token: write, contents: write) that their jobs require.
#
# `template-injection` is scoped out because the flagged expansions read from
# trusted GitHub event contexts (`github.base_ref`,
# `github.event.workflow_run.*`) rather than untrusted pull-request input.
#
# `dangerous-triggers` is scoped out because `workflow_run` is used
# intentionally by the release, guardrail and AI-authorize workflows.
#
# `cache-poisoning` and `github-env` are scoped out for the Tauri release
# workflow, which intentionally caches build outputs and writes to GITHUB_ENV
# from trusted release contexts.
#
# Every other audit remains active: supply-chain advisories
# (known-vulnerable-actions), credential persistence (artipacked), local action
# references (self-repository), shell defaults, workflow inputs, and the like.
# The CI step uses `--min-severity medium` so low/informational findings from
# those remaining audits do not fail the build; anything medium or higher
# still does.
rules:
  unpinned-uses:
    disable: true
  excessive-permissions:
    disable: true
  template-injection:
    disable: true
  dangerous-triggers:
    disable: true
  cache-poisoning:
    disable: true
  github-env:
    disable: true
