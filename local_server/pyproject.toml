[project]
name = "agentic-odi-local-server"
version = "0.1.0"
description = "Local FastAPI server for Agentic ODI (direct DB)."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "agentic-odi-core",
]

[tool.uv.sources]
agentic-odi-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[project.scripts]
agentic-odi-local-server = "local_server.main:main"
