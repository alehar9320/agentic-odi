codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "50...90"

  status:
    # The authoritative Python gate is the `test` job in ci.yml: pytest runs
    # with --cov-fail-under=89, so it needs no token and fires on forks. The
    # studio job holds the front-end thresholds in vite.config.ts. Codecov is
    # the reporting surface; its 90% target with a 1% dip lands on the same
    # 89% minimum.
    project:
      default:
        target: 90%
        threshold: 1%
        # The 90% bar is the Python floor measured by the `test` job. The
        # studio upload reports under its own flag so its lower number cannot
        # drag this status down; the Vitest thresholds gate the front end.
        flags:
          - python
    # Patch coverage is advisory while the suite is still being built out.
    patch:
      default:
        informational: true

flags:
  python:
    paths:
      - apps/cli
      - apps/mcp-server
      - apps/studio-api
      - packages
  studio:
    paths:
      - apps/studio

comment:
  layout: "header, diff, files"
  require_changes: true
  branches:
    - main

ignore:
  - "**/tests/**"
