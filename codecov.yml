codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "50...90"

  status:
    # The suite is above 90% project-wide; hold that floor (with a 1% dip)
    # instead of letting coverage drift back down.
    project:
      default:
        target: 90%
        threshold: 1%
    # Patch coverage is advisory while the suite is still being built out.
    patch:
      default:
        informational: true

comment:
  layout: "header, diff, files"
  require_changes: true
  branches:
    - main

ignore:
  - "**/tests/**"
  - "studio/**"
