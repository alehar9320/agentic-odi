[project]
name = "agentic-odi-connectors"
version = "0.1.0"
description = "External system connectors for Agentic ODI, including an MCP client ingest connector."
requires-python = ">=3.10"
dependencies = [
    "fastmcp",
    "pydantic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectors"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
