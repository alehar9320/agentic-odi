[project]
name = "agentic-odi-client"
version = "0.1.0"
description = "Local dev launcher for Agentic ODI (MCP server + Living Studio sidecar)."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agentic-odi-dev = "client.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/client"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
