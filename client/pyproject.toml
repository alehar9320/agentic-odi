[project]
name = "agentic-odi-client"
version = "0.1.0"
description = "Streamlit chat client and local dev launcher for Agentic ODI."
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "openai",
    "streamlit",
]

[project.scripts]
agentic-odi-dev = "client.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/client"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
