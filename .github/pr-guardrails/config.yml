# Thresholds for the pull-request guardrails (issue #86).
# The default is deny: only the entries below are allowed.
max_deletions: 500
max_changed_files: 2000
max_behind: 50
tolerance: 0.20

# Regenerated by design; their churn is not a signal.
generated_exclusions:
  - "uv.lock"
  - "**/uv.lock"
  - "package-lock.json"
  - "**/package-lock.json"
  - "yarn.lock"
  - "**/yarn.lock"
  - "pnpm-lock.yaml"
  - "**/pnpm-lock.yaml"
  - "Cargo.lock"
  - "**/Cargo.lock"
  - "poetry.lock"
  - "**/poetry.lock"
  - "*.lock"
  - "openapi.json"
  - "**/openapi.json"
  - "schema.d.ts"
  - "**/schema.d.ts"
  - "coverage.xml"
  - "**/coverage.xml"
