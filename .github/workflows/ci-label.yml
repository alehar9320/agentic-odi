name: CI Label

# Keeps ci-pending and ready-for-merge in sync on every push and every
# check-run completion. No repository secrets: it only needs the checked-out
# repository and the GITHUB_TOKEN the workflow receives automatically.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed, edited]
  check_run:
    types: [completed]

concurrency:
  group: ci-label-${{ github.event.pull_request.number || github.event.check_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  ci-label:
    name: Label pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write # gh label create lives under the issues API
    steps:
      # Detect the pull request number and whether it is a fork from either
      # event shape. A check_run on a non-PR commit yields no number, so the
      # job skips labeling in that case.
      - name: Detect pull request and fork status
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            HEAD_REF="${{ github.event.pull_request.head.ref }}"
            IS_FORK="${{ github.event.pull_request.head.repo.fork }}"
          else
            # check_run: the check belongs to the PR(s) listed under pull_requests.
            PR_NUMBER="${{ github.event.check_run.pull_requests[0].number }}"
            HEAD_REF="${{ github.event.check_run.pull_requests[0].head.ref }}"
            IS_FORK="${{ github.event.check_run.pull_requests[0].head.repository.fork }}"
          fi

          if [ -z "${PR_NUMBER}" ] || [ "${PR_NUMBER}" = "null" ]; then
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            echo "is_fork=" >> "$GITHUB_OUTPUT"
            echo "head_ref=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Normalise booleans that arrive as the strings "true"/"false".
          case "${IS_FORK}" in
            true) IS_FORK=true ;;
            *) IS_FORK=false ;;
          esac

          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "is_fork=${IS_FORK}" >> "$GITHUB_OUTPUT"
          echo "head_ref=${HEAD_REF}" >> "$GITHUB_OUTPUT"

      # A fork pull request gets a read-only token, so labeling it cannot
      # succeed. Say so instead of failing red on a PR we may not touch.
      - name: Note fork pull requests
        if: ${{ steps.detect.outputs.is_fork == 'true' }}
        run: echo "::notice::Skipping labels for a fork pull request (read-only token)."

      - name: Ensure labels exist
        if: ${{ steps.detect.outputs.is_fork != 'true' && steps.detect.outputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh label create "ci-pending" --color fbca04 \
            --description "CI checks still running; unblocked and ready for human review once green" \
            --repo "$REPO" --force
          gh label create "ready-for-merge" --color 00aa00 \
            --description "CI is green and no merge conflicts; ready to merge" \
            --repo "$REPO" --force

      - name: Checkout PR branch
        if: ${{ steps.detect.outputs.is_fork != 'true' && steps.detect.outputs.pr_number != '' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.detect.outputs.head_ref || github.ref }}
          fetch-depth: 0

      - name: Assemble PR facts
        if: ${{ steps.detect.outputs.is_fork != 'true' && steps.detect.outputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.detect.outputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          # gh pr view returns one object with every field this job needs:
          # isDraft, mergeable, reviewDecision, reviews, statusCheckRollup.
          gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json isDraft,mergeable,reviewDecision,reviews,statusCheckRollup,headRefName,baseRefName,title \
            > "$RUNNER_TEMP/pr-view.json"

          # gh camelCase keys -> snake_case keys the Python script expects.
          jq -n \
            --slurpfile view "$RUNNER_TEMP/pr-view.json" \
            '{
              is_draft: $view[0].isDraft,
              mergeable: $view[0].mergeable,
              review_decision: $view[0].reviewDecision,
              reviews: $view[0].reviews,
              check_runs: $view[0].statusCheckRollup,
              head_ref_name: $view[0].headRefName,
              base_ref_name: $view[0].baseRefName,
              title: $view[0].title
            }' > "$RUNNER_TEMP/facts.json"

      - name: Compute desired labels
        if: ${{ steps.detect.outputs.is_fork != 'true' && steps.detect.outputs.pr_number != '' }}
        id: compute
        run: |
          computed="$(uv run python scripts/ci_label.py --facts "$RUNNER_TEMP/facts.json")"
          echo "computed=$computed" >> "$GITHUB_OUTPUT"

      - name: Remove stale labels then apply desired ones
        if: ${{ steps.detect.outputs.is_fork != 'true' && steps.detect.outputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.detect.outputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          # Remove labels this run no longer wants, then add what it does.
          # Removing an absent label is a harmless no-op.
          for label in ci-pending ready-for-merge; do
            gh pr edit "${PR_NUMBER}" --repo "${REPO}" --remove-label "${label}" >/dev/null 2>&1 || true
          done

          while IFS= read -r label; do
            [ -z "${label}" ] && continue
            gh pr edit "${PR_NUMBER}" --repo "${REPO}" --add-label "${label}"
          done <<< "${{ steps.compute.outputs.computed }}"

          {
            echo "### CI labels applied"
            echo
            echo '```'
            printf '%s\n' "${{ steps.compute.outputs.computed }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
