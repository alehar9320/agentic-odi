name: PR AI merge authorize

# Labels a pull request ``ai-merge-authorized`` when every gate passes:
#   * ``ai-merge-safe`` (trust label from pr-ai-merge.yml)
#   * CI green (the head commit's check runs are complete and green; the legacy
#     combined commit status is not consulted -- see ADR 0009)
#   * ``ready-for-merge`` (no merge conflicts)
#   * open pull request targeting main, not a draft
#
# Any failing gate removes the label. Deterministic: no LLM calls, no network
# beyond the GitHub API, no pull request code executed. Fork pull requests are
# skipped per-job because they carry a read-only token.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # `check_suite` does not fire for suites GitHub Actions created itself, so it
  # could never see `CI green` or `PR guardrails` finish. `workflow_run` is the
  # trigger that follows an Actions workflow to completion.
  workflow_run:
    workflows: ["CI", "PR guardrails"]
    types: [completed]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write # gh label create lives under the issues API

defaults:
  run:
    shell: bash

jobs:
  labels:
    name: Label pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # A fork pull request gets a read-only token, so labeling it cannot
      # succeed. Say so instead of failing red on a PR we may not touch.
      - name: Note fork pull requests
        if: ${{ github.event.pull_request.head.repo.fork }}
        run: echo "::notice::Skipping AI merge authorize labels for a fork pull request (read-only token)."

      # Resolve which pull request(s) to process. On pull_request events we
      # have a PR number. On workflow_run we have the head SHA but need to map
      # it to a PR number. On schedule / workflow_dispatch we re-scan every
      # open PR targeting main so labels stay eventually consistent.
      - name: Resolve pull request numbers to process
        if: ${{ ! github.event.pull_request.head.repo.fork }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "${{ github.event.pull_request.number }}" > "$RUNNER_TEMP/pr-numbers.txt"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            head_sha="${{ github.event.workflow_run.head_sha }}"
            # `gh pr list` caps at 30 rows before a local filter runs; ask the
            # commit which pull requests contain it instead.
            gh api "repos/$REPO/commits/$head_sha/pulls" --paginate \
              --jq '.[] | select(.state == "open") | .number' \
              > "$RUNNER_TEMP/pr-numbers.txt" || true
          else
            gh pr list --repo "$REPO" --base main --state open --limit 1000 \
              --json number -q '.[].number' \
              > "$RUNNER_TEMP/pr-numbers.txt"
          fi

      # The label did not exist, so --add-label failed with
      # "'ai-merge-authorized' not found" and the job went red. Create it once.
      - name: Ensure the AI merge authorized label exists
        if: ${{ ! github.event.pull_request.head.repo.fork }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh label create "ai-merge-authorized" --color 0e8a16 \
            --description "CI green and trust label present; AI agent may auto-merge" \
            --repo "$REPO" --force

      # The gate below runs scripts/pr_ai_authorize.py, so the job has to have
      # the repository on disk. Without this checkout that step died with exit
      # code 2 and every pull request in the repository showed a red label job.
      # Pin the base ref for the same reason as the other labelers: the default
      # pull_request ref is the merge commit, and actions/checkout runs
      # `git submodule foreach` while stripping its auth header, which exits 128
      # on a branch carrying a stray gitlink.
      - uses: actions/checkout@v7
        if: ${{ ! github.event.pull_request.head.repo.fork }}
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref }}

      - name: Process each pull request
        if: ${{ ! github.event.pull_request.head.repo.fork }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          AGENTIC_ODI_E2E_BLOCKING: ${{ vars.AGENTIC_ODI_E2E_BLOCKING }}
        run: |
          while IFS= read -r PR_NUMBER; do
            [ -z "$PR_NUMBER" ] && continue

            # Assemble the fact sheet the tested Python entrypoint reads.
            gh pr view "$PR_NUMBER" --repo "$REPO" \
              --json author,body,headRefName,baseRefName,isDraft,state,labels \
              > "$RUNNER_TEMP/meta-$PR_NUMBER.json"

            # The head commit's check suite. The legacy combined commit status
            # carries only third-party statuses (Chromatic here), so it reads
            # success while every Actions job is still queued -- that is what
            # armed auto-merge on #1100 minutes after a push (ADR 0009).
            HEAD_SHA="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid -q '.headRefOid')"
            if ! gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100&filter=latest" \
              > "$RUNNER_TEMP/checks-$PR_NUMBER.json" 2>/dev/null; then
              echo '{"check_runs": []}' > "$RUNNER_TEMP/checks-$PR_NUMBER.json"
            fi

            jq -n \
              --slurpfile meta "$RUNNER_TEMP/meta-$PR_NUMBER.json" \
              --slurpfile checks "$RUNNER_TEMP/checks-$PR_NUMBER.json" \
              '{
                author: $meta[0].author,
                branch: $meta[0].headRefName,
                body: $meta[0].body,
                commits: [],
                files: [],
                labels: ($meta[0].labels | map(.name)),
                state: $meta[0].state,
                draft: $meta[0].isDraft,
                base: $meta[0].baseRefName,
                checks: ($checks[0].check_runs // [])
              }' \
              > "$RUNNER_TEMP/facts-$PR_NUMBER.json"

            computed="$(python3 scripts/pr_ai_authorize.py --facts "$RUNNER_TEMP/facts-$PR_NUMBER.json")"

            # Removing an absent label is a harmless no-op, so it is tolerated.
            # Adding must not be swallowed.
            if [ -n "$computed" ]; then
              gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "ai-merge-authorized"
            else
              gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "ai-merge-authorized" || true
            fi

            {
              echo "### AI merge authorize label — PR #$PR_NUMBER"
              echo
              if [ -n "$computed" ]; then
                echo "Applied: ai-merge-authorized (CI green, trust label present)"
              else
                echo "Not applied: one or more gates did not pass."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/pr-numbers.txt"
