name: Label merge conflicts

# Applies `merge-conflict` to a pull request that cannot merge, and
# `ready-for-merge` to one that can. GitHub computes `mergeable` lazily and
# reports `UNKNOWN` for a moment after every push, so the state is polled until
# it settles; reading it once labelled nothing, which is why the label had never
# been applied to a single pull request.
#
# It also runs when `CI` or `PR guardrails` completes: `clean` (the state that
# earns `ready-for-merge`) only becomes true once the required checks have
# passed, and the six-hourly sweep used to be the only thing that looked again.
# The merge path waits on this label, so a green pull request could sit
# unauthorized for hours while the fast path was a bug (ADR 0009). `check_suite`
# cannot be that trigger: GitHub does not fire it for suites Actions created.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["CI", "PR guardrails"]
    types: [completed]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write # gh label create lives under the issues API

concurrency:
  # `github.ref` is `refs/heads/main` for every `workflow_run` completion, so a
  # group keyed on it put every pull request's finished CI run in one group and
  # `cancel-in-progress` killed all but one of them. Key on the commit for a
  # workflow_run, the PR for a pull request, and the ref only for the sweep.
  group: label-merge-conflicts-${{ github.event.workflow_run.head_sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  label-merge-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No checkout. A write-permission workflow must not run pull request code,
      # and running no tree at all is the strongest form of that: every step
      # below talks to the API through `gh` with an explicit --repo. The base-ref
      # checkout this used to do added only a failure mode — actions/checkout
      # runs `git submodule foreach` while removing its auth header, which exits
      # 128 on a base tree carrying an unregistered gitlink, so the job went red
      # over a tree it never read.
      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create merge-conflict --color b60205 \
            --description "Pull request has merge conflicts" \
            --repo "$GITHUB_REPOSITORY" --force
          gh label create ready-for-merge --color 00aa00 \
            --description "CI is green and no merge conflicts; ready to merge" \
            --repo "$GITHUB_REPOSITORY" --force

      - name: Collect target PR numbers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "${{ github.event.pull_request.number }}" > "$RUNNER_TEMP/pr-numbers.txt"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            head_sha="${{ github.event.workflow_run.head_sha }}"
            # `gh pr list` caps at 30 rows before a local filter runs; ask the
            # commit which pull requests contain it instead.
            gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha/pulls" --paginate \
              --jq '.[] | select(.state == "open") | .number' \
              > "$RUNNER_TEMP/pr-numbers.txt" || true
          else
            gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open \
              --limit 1000 --json number -q '.[].number' \
              > "$RUNNER_TEMP/pr-numbers.txt"
          fi

      - name: Label each PR by merge state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while IFS= read -r number; do
            [ -z "$number" ] && continue

            # GitHub reports UNKNOWN while it computes mergeability, which it
            # does lazily after each push. Poll a bounded number of times rather
            # than reading a state that is not yet decided.
            state=""
            for attempt in $(seq 1 10); do
              state="$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" \
                --json mergeStateStatus -q '.mergeStateStatus')"
              [ "$state" != "UNKNOWN" ] && break
              sleep 6
            done

            case "$state" in
              dirty)
                gh pr edit "$number" --repo "$GITHUB_REPOSITORY" \
                  --add-label merge-conflict >/dev/null
                gh pr edit "$number" --repo "$GITHUB_REPOSITORY" \
                  --remove-label ready-for-merge >/dev/null || true
                ;;
              clean)
                gh pr edit "$number" --repo "$GITHUB_REPOSITORY" \
                  --add-label ready-for-merge >/dev/null
                gh pr edit "$number" --repo "$GITHUB_REPOSITORY" \
                  --remove-label merge-conflict >/dev/null || true
                ;;
              UNKNOWN)
                # Still undecided after the retries: leave the labels as they
                # are rather than assert a merge state nobody knows.
                echo "::notice::PR #$number: merge state still UNKNOWN; leaving labels unchanged"
                ;;
              *)
                # behind, blocked, unstable, has_hooks, draft: not a conflict,
                # so clear the conflict label without claiming the PR is ready.
                gh pr edit "$number" --repo "$GITHUB_REPOSITORY" \
                  --remove-label merge-conflict >/dev/null || true
                gh pr edit "$number" --repo "$GITHUB_REPOSITORY" \
                  --remove-label ready-for-merge >/dev/null || true
                ;;
            esac
            echo "PR #$number: $state"
          done < "$RUNNER_TEMP/pr-numbers.txt"
