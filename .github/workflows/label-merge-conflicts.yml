name: Label merge conflicts

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write # gh label create lives under the issues API

concurrency:
  group: label-merge-conflicts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label-merge-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create merge-conflict --color b60205 \
            --description "Pull request has merge conflicts" \
            --repo "$GITHUB_REPOSITORY" --force
          gh label create ready-for-merge --color 00aa00 \
            --description "CI is green and no merge conflicts; ready to merge" \
            --repo "$GITHUB_REPOSITORY" --force

      - name: Collect target PR numbers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "${{ github.event.pull_request.number }}" > "$RUNNER_TEMP/pr-numbers.txt"
          else
            gh pr list --repo "$GITHUB_REPOSITORY" --base main \
              --state open --json number -q '.[].number' \
              > "$RUNNER_TEMP/pr-numbers.txt"
          fi

      - name: Label each PR by merge state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while IFS= read -r number; do
            [ -z "$number" ] && continue
            state="$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" \
              --json mergeStateStatus -q '.mergeStateStatus')"
            case "$state" in
              dirty)
                gh pr edit "$number" --repo "$GITHUB_REPOSITORY" \
                  --add-label merge-conflict >/dev/null
                gh pr edit "$number" --repo "$GITHUB_REPOSITORY" \
                  --remove-label ready-for-merge >/dev/null || true
                ;;
              clean)
                gh pr edit "$number" --repo "$GITHUB_REPOSITORY" \
                  --add-label ready-for-merge >/dev/null
                gh pr edit "$number" --repo "$GITHUB_REPOSITORY" \
                  --remove-label merge-conflict >/dev/null || true
                ;;
              *)
                gh pr edit "$number" --repo "$GITHUB_REPOSITORY" \
                  --remove-label merge-conflict >/dev/null || true
                gh pr edit "$number" --repo "$GITHUB_REPOSITORY" \
                  --remove-label ready-for-merge >/dev/null || true
                ;;
            esac
            echo "PR #$number: $state"
          done < "$RUNNER_TEMP/pr-numbers.txt"
