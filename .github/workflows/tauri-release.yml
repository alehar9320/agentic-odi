name: Tauri Release

# The desktop bundles ride on the same release as the CLI archives, so this
# workflow needs the same trigger treatment as `release.yml`: the `push: tags`
# trigger alone never fired because release-please creates the tag with the
# repository GITHUB_TOKEN, and GitHub suppresses workflow runs for events that
# token produces. The workflow listens on the published release and on the
# release-please run itself; `workflow_dispatch` is the manual self-heal path,
# and `push` stays for tags created by hand. The `resolve` job gates every path
# so a run that finds the release already carrying every bundle does nothing.
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_run:
    workflows: ["release-please"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach desktop bundles to (default: the latest release)"
        required: false
        type: string
      force:
        description: "Rebuild even when the release already has every bundle"
        required: false
        type: boolean
        default: false

concurrency:
  group: tauri-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.gate.outputs.tag }}
      version: ${{ steps.gate.outputs.version }}
      should_build: ${{ steps.gate.outputs.should_build }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the tag and check for missing bundles
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          tag=""
          case "$EVENT" in
            push)              tag="${GITHUB_REF_NAME}" ;;
            release)           tag="${GITHUB_REF_NAME}" ;;
            workflow_dispatch) tag="$DISPATCH_TAG" ;;
            workflow_run)      tag="$RUN_BRANCH" ;;
          esac
          case "$tag" in
            v[0-9]*) ;;
            *)
              echo "No explicit v* tag for a '$EVENT' run (got '$tag'); using the latest release."
              tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
              ;;
          esac
          args=(--stream studio --tag "$tag" --repo "$GITHUB_REPOSITORY")
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python3 scripts/release_assets.py "${args[@]}" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  preflight:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require updater signing key
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required to publish a signed release; without it the updater artifacts would be broken."
            exit 1
          fi

  build:
    needs: [resolve, preflight]
    if: needs.resolve.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      # Build the tagged tree so the bundles match the release they attach to.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Install Linux webview dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/studio/src-tauri -> target

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/studio

      - name: Import Windows signing certificate
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE)) {
            Write-Output "No WINDOWS_CERTIFICATE secret — building unsigned Windows installer."
            exit 0
          }
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $path = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($path, $bytes)
          $secure = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          $config = '{"bundle":{"windows":{"certificateThumbprint":"' + $cert.Thumbprint + '"}}}'
          "TAURI_CONFIG=$config" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "Imported Windows certificate $($cert.Thumbprint)"

      # The release already exists (release-please cuts it for the tag), so this
      # attaches the desktop bundles to it and publishes it — no draft is left
      # behind for a maintainer to publish by hand.
      - name: Build and attach release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/studio
          tagName: ${{ needs.resolve.outputs.tag }}
          releaseName: ${{ needs.resolve.outputs.tag }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # A release without a usable latest.json cannot update anybody. Fail the
  # release loudly instead of leaving a quiet download that installs nothing.
  verify:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the signed updater manifest covers every platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          dir="$(mktemp -d)"
          for attempt in 1 2 3 4 5 6; do
            if gh release download "$TAG" --pattern latest.json --dir "$dir" --clobber; then
              break
            fi
            echo "latest.json not available yet (attempt $attempt); retrying…"
            sleep 10
          done
          manifest="$dir/latest.json"
          if [ ! -f "$manifest" ]; then
            echo "::error::latest.json was not published for $TAG, so installed apps cannot update."
            exit 1
          fi
          manifest_version="$(jq -r '.version // empty' "$manifest")"
          if [ "$manifest_version" != "$version" ]; then
            echo "::error::latest.json advertises $manifest_version but the tag is $version."
            echo "The desktop app version is out of sync with the release; see the release-please extra-files config."
            exit 1
          fi
          for key in linux-x86_64 windows-x86_64 darwin-aarch64 darwin-x86_64; do
            if ! jq -e --arg k "$key" '.platforms[$k].url and .platforms[$k].signature' "$manifest" > /dev/null; then
              echo "::error::latest.json is missing a signed $key artifact."
              exit 1
            fi
          done
          echo "OK: $TAG publishes a signed updater manifest for every platform"
