name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Sunday 06:00 UTC. Scheduled runs only execute from the default branch, and
    # the two jobs that judge the deployed world rather than a pull request react to
    # this event: updater-e2e, and hosted-first-run below. Anything that wants a
    # probe sooner takes `workflow_dispatch`.
    - cron: "0 6 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # A PR with no description gives a reviewer nothing to check the diff
  # against, so an empty body fails the build before any expensive job runs.
  pr-body:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require a non-empty pull request body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          body="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json body --jq '.body')"
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "::error::The pull request body is empty. Summarize the change and how you verified it."
            exit 1
          fi
          echo "OK: pull request body is present"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Run Ruff Lint (no auto-fix)
        run: uv run ruff check .

      - name: Verify Ruff Formatting (no auto-fix)
        run: uv run ruff format --check .

      - name: Verify one version number across all declared surfaces
        run: uv run python scripts/check_version_parity.py

      - name: Verify the mascot assets match the generator
        run: uv run python brand/tools/render.py --check

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Run Mypy
        run: uv run mypy apps brand packages

      - name: Run Mypy (website)
        run: uv run --directory website mypy .

  # The docs are only true if the code agrees. The drift check is conservative:
  # it only reports a path that names a known top-level directory and a command
  # that starts with a known entry point.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Check the documentation against the code
        run: uv run python scripts/doc_check.py

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Run Bandit
        run: uv run bandit -c pyproject.toml -r apps packages

      - name: Run Bandit (website)
        run: uv run bandit -c pyproject.toml -r website/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # The protected-files contract diffs the branch against its base, so this
      # job needs the parent commit, not a one-commit shallow checkout.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Pytest
        run: |
          uv run pytest \
            --cov=agentic_odi_cli \
            --cov=agentic_odi_connectors \
            --cov=agentic_odi_core \
            --cov=agentic_odi_mcp_server \
            --cov=agentic_odi_studio_api \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

      # One upload per run is enough; the 3.12 report is the canonical one.
      - name: Upload coverage to Codecov
        if: ${{ matrix.python-version == '3.12' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  smoke:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, security, test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: CLI reports a version
        run: |
          version="$(uv run python -m agentic_odi_cli --version)"
          [ -n "$version" ]
          echo "OK: $version"

      - name: CLI exposes connectors commands
        run: |
          help="$(uv run python -m agentic_odi_cli connectors --help)"
          echo "$help" | grep -q list
          echo "$help" | grep -q ingest
          echo "OK: connectors help"

      - name: Installer installs from a simulated release
        run: bash scripts/tests/install_e2e.sh

      # The updater's second-launch wait, guarded without a 40-minute build: the
      # poll, the process-state report, and the feed log the wait reads. The full
      # proof runs at the release (tauri-release.yml `updater-proof`), which is
      # where a wrong answer can still stop a ship.
      - name: The updater waits for the second launch instead of sleeping
        run: bash scripts/tests/desktop_update_wait_e2e.sh

      - name: MCP server boots and serves /mcp
        run: |
          uv run python -m agentic_odi_mcp_server > /tmp/mcp_server.log 2>&1 &
          SERVER_PID=$!
          probe() {
            curl -sfX POST http://localhost:8000/mcp \
              -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","method":"initialize","id":1,"params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
              -o /dev/null
          }
          ok=0
          for _ in $(seq 1 30); do
            if probe; then ok=1; break; fi
            sleep 1
          done
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then
            echo "MCP server did not respond on :8000/mcp"
            cat /tmp/mcp_server.log
            exit 1
          fi
          echo "OK: MCP server responded with 200"

      - name: Living Studio sidecar serves the studio API
        run: |
          AGENTIC_ODI_BACKEND=mcp uv run python -m agentic_odi_studio_api.main > /tmp/sidecar.log 2>&1 &
          SIDECAR_PID=$!
          # The sidecar issues a per-install bearer token on first boot; every
          # /api route requires it, so the probe reads the same file the app uses.
          TOKEN_FILE="${AGENTIC_ODI_STUDIO_TOKEN:-$HOME/.config/agentic-odi/studio-token}"
          for _ in $(seq 1 30); do [ -s "$TOKEN_FILE" ] && break; sleep 1; done
          TOKEN="$(cat "$TOKEN_FILE")"
          probe() {
            curl -fsS -X POST http://127.0.0.1:8100/api/health/mcp \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' \
              -d '{"mcp_url":"http://127.0.0.1:8000/mcp"}' -o /dev/null &&
              curl -fsS -H "Authorization: Bearer $TOKEN" \
                "http://127.0.0.1:8100/api/canvas?mcp_url=http://127.0.0.1:8000/mcp" -o /dev/null
          }
          ok=0
          for _ in $(seq 1 30); do
            if probe; then ok=1; break; fi
            sleep 1
          done
          kill "$SIDECAR_PID" 2>/dev/null || true
          wait "$SIDECAR_PID" 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then
            echo "Living Studio sidecar did not respond on :8100"
            cat /tmp/sidecar.log
            exit 1
          fi
          echo "OK: sidecar studio API responded with 200"

      - name: scripts/dev.py brings up both services and stops cleanly
        run: |
          uv run python scripts/dev.py > /tmp/clientrun.log 2>&1 &
          RUN_PID=$!
          # The earlier sidecar step already minted the per-install token, so the
          # MCP server started here gates /mcp as well: both probes send it.
          TOKEN_FILE="${AGENTIC_ODI_STUDIO_TOKEN:-$HOME/.config/agentic-odi/studio-token}"
          for _ in $(seq 1 60); do [ -s "$TOKEN_FILE" ] && break; sleep 1; done
          TOKEN="$(cat "$TOKEN_FILE")"
          probe() {
            curl -sf -H "Authorization: Bearer $TOKEN" -o /dev/null http://127.0.0.1:8100/api/config &&
              curl -sfX POST http://127.0.0.1:8000/mcp \
                -H "Authorization: Bearer $TOKEN" \
                -H 'Content-Type: application/json' \
                -d '{"jsonrpc":"2.0","method":"initialize","id":1,"params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
                -o /dev/null
          }
          ok=0
          for _ in $(seq 1 60); do
            if probe; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            echo "scripts/dev.py did not bring up both services"
            cat /tmp/clientrun.log
            kill "$RUN_PID" 2>/dev/null || true
            exit 1
          fi
          kill -INT "$RUN_PID"
          wait "$RUN_PID"
          echo "OK: both services stopped cleanly"

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # The site is generated from the repository's own sources and built in CI;
      # no committed copy exists. If a fresh build fails, the PR is not ready.

      - name: Pytest (website)
        run: uv run --directory website pytest tests/

      - name: Build site
        run: uv run python website/tools/build_site.py --out _site

      - name: Upload built site for review
        uses: actions/upload-artifact@v7
        with:
          name: website-site
          path: _site
          if-no-files-found: error

  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Check the cold-start bundle budget
        working-directory: .
        run: node scripts/check_bundle_budget.mjs

      - name: Verify generated API types are up to date
        run: |
          npm run gen:api-types
          git diff --exit-code -- src/api/schema.d.ts

  # Contrast as a build gate (issue #543, parent #331). A pair that drops below
  # AA, or a screen that paints a pair not on the known list, fails here instead
  # of waiting for review. It is its own job rather than a step in `e2e` because
  # `e2e` is advisory (`continue-on-error`) and slower; this one must block a
  # merge. It needs the same browser and built Studio as `e2e`.
  #
  # The run is bounded: only `a11y.spec.ts` runs, and it is the deterministic
  # part of the browser suite — no chat, no model, no LLM.
  contrast:
    name: Contrast gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the Studio
        run: npm run build

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run the contrast gate
        run: npm run test:e2e -- a11y.spec.ts

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contrast-report
          path: apps/studio/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # Component snapshots are published by `chromatic.yml`, which runs on push.
  # Chromatic recommends push over pull_request because a PR run checks out an
  # ephemeral merge commit that diffs against the wrong baseline.

  # The browser-level suite. It drives the real Studio against the real
  # sidecar and MCP server, so it is slower than the other jobs and can be
  # flakier than a unit test.
  #
  # Two ways to turn it off, neither of which needs a code change:
  #   - set the repository variable AGENTIC_ODI_E2E to "false"
  #   - remove the continue-on-error below
  # A skipped e2e job does not fail CI green; see the ci-green job.
  e2e:
    name: End-to-end
    if: ${{ vars.AGENTIC_ODI_E2E != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      - name: Install dependencies
        working-directory: apps/studio
        run: npm ci

      - name: Build the Studio
        working-directory: apps/studio
        run: npm run build

      - name: Install the browser
        working-directory: apps/studio
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end suite
        working-directory: apps/studio
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/studio/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  tauri-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: apps/studio/src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/studio/src-tauri -> target

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo clippy
        run: cargo clippy -- -D warnings

      - name: Cargo check
        run: cargo check

  tauri-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/studio/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/studio

      # Dependabot PRs cannot read repository secrets, so the signing key is
      # empty there. Export it only when present and disable updater artifacts
      # otherwise; passing an empty key makes the bundler try (and fail) to
      # decode it.
      - name: Build desktop bundle
        working-directory: apps/studio
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$SIGNING_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$SIGNING_KEY_PASSWORD"
            npm run tauri -- build
          else
            echo "No TAURI_SIGNING_PRIVATE_KEY provided — building without signed updater artifacts."
            npm run tauri -- build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v7
        with:
          name: tauri-bundles-linux
          if-no-files-found: warn
          path: |
            apps/studio/src-tauri/target/release/bundle/deb/*.deb
            apps/studio/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/studio/src-tauri/target/release/bundle/appimage/*.AppImage.sig

  # Weekly proof that the shipped updater actually updates: builds signed
  # 0.1.0 and 0.2.0 AppImages against a local feed and watches 0.1.0 replace
  # its own file. Runs on schedule/dispatch only, deliberately outside
  # `ci-green`'s needs — a schedule-gated job would report `skipped` on every
  # PR and break the all-results-success aggregate (same treatment as
  # `pr-body`). This is the early warning; the result a release answers to is
  # the same script run at the tag by `updater-proof` in
  # .github/workflows/tauri-release.yml, which `build` waits for (#613). No
  # repository secret is used: the script generates a throwaway minisign key
  # per run, and the committed updater public key is untouched.
  updater-e2e:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install webview, AppImage, and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libfuse2 xvfb

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/studio/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/studio

      - name: Prove the updater end to end
        env:
          # GitHub runners have no FUSE daemon; extract-and-run also keeps the
          # on-disk AppImage as the updater's replacement target.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: xvfb-run -a bash scripts/verify-desktop-update.sh

      - name: Upload the run logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: updater-e2e-log
          if-no-files-found: ignore
          path: /tmp/studio-update-e2e/

  # Production deploys on every push to main, and a merged PR is not proof the
  # change reached the branch that deploys. This knocks on the real URL and reports
  # one dated line per promise the README makes a visitor. It sits outside
  # `ci-green`'s `needs:` for the same reason `pr-body` and `updater-e2e` do: a
  # broken deploy is news about the deploy, not about the pull request that
  # happened to share the branch, and a suite that is green over a branch nobody
  # deploys is exactly how #492 and #609 went unnoticed.
  hosted-first-run:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Probe the hosted first run
        run: |
          set +e
          bash scripts/verify-hosted-first-run.sh --commit "$(git rev-parse HEAD)" \
            | tee /tmp/hosted-first-run.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::the hosted first run broke; the dated lines are in the hosted-first-run-log artifact"
            exit "$status"
          fi

      - name: Upload the probe output on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-first-run-log
          if-no-files-found: ignore
          path: /tmp/hosted-first-run.log

  ci-green:
    name: CI green
    runs-on: ubuntu-latest
    needs: [lint, typecheck, security, test, smoke, website, studio, contrast, tauri-check, tauri-build, e2e]
    if: always()
    steps:
      - name: Verify all required jobs succeeded
        env:
          # The e2e job is optional: it is skipped when the AGENTIC_ODI_E2E
          # repository variable is set to "false", and that must not turn CI
          # red. Every other job has to succeed.
          E2E_RESULT: ${{ needs.e2e.result }}
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          SECURITY: ${{ needs.security.result }}
          TEST: ${{ needs.test.result }}
          SMOKE: ${{ needs.smoke.result }}
          WEBSITE: ${{ needs.website.result }}
          STUDIO: ${{ needs.studio.result }}
          CONTRAST: ${{ needs.contrast.result }}
          TAURI_CHECK: ${{ needs.tauri-check.result }}
          TAURI_BUILD: ${{ needs.tauri-build.result }}
        run: |
          failed=0
          for job in LINT TYPECHECK SECURITY TEST SMOKE WEBSITE STUDIO CONTRAST TAURI_CHECK TAURI_BUILD; do
            result="${!job}"
            echo "$job: $result"
            if [ "$result" != "success" ]; then
              echo "::error::$job did not succeed ($result)"
              failed=1
            fi
          done
          echo "e2e: $E2E_RESULT"
          if [ "$E2E_RESULT" != "success" ] && [ "$E2E_RESULT" != "skipped" ]; then
            echo "::error::e2e did not succeed ($E2E_RESULT)"
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "OK: all required jobs succeeded"
