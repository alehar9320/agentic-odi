name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Sunday 06:00 UTC. Scheduled runs only execute from the default branch, and
    # the two jobs that judge the deployed world rather than a pull request react to
    # this event: updater-e2e, and hosted-first-run below. Anything that wants a
    # probe sooner takes `workflow_dispatch`.
    - cron: "0 6 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A pull request may cancel its own previous build; a push to main may not,
  # because the cancelled run is the only CI record that merge would ever get.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # A PR with no description gives a reviewer nothing to check the diff
  # against, so an empty body fails the build before any expensive job runs.
  pr-body:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require a non-empty pull request body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          body="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json body --jq '.body')"
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "::error::The pull request body is empty. Summarize the change and how you verified it."
            exit 1
          fi
          echo "OK: pull request body is present"

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Run Ruff Lint (no auto-fix)
        run: uv run ruff check .

      - name: Verify Ruff Formatting (no auto-fix)
        run: uv run ruff format --check .

      - name: Verify one version number across all declared surfaces
        run: uv run python scripts/check_version_parity.py

      - name: Verify the mascot assets match the generator
        run: uv run python brand/tools/render.py --check

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Run Mypy
        run: uv run mypy apps brand packages

      - name: Run Mypy (website)
        run: uv run --directory website mypy .

  # The docs are only true if the code agrees. The drift check is conservative:
  # it only reports a path that names a known top-level directory and a command
  # that starts with a known entry point.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Check the documentation against the code
        run: uv run python scripts/doc_check.py

      - name: Check the generated documentation blocks are current
        run: uv run python scripts/docs_index.py --check

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Run Bandit
        run: uv run bandit -c pyproject.toml -r apps packages

      - name: Run Bandit (website)
        run: uv run bandit -c pyproject.toml -r website/

  # Bandit reads code patterns; it cannot say that a pinned version has a known
  # advisory. This job asks the advisory databases directly, for the runtime
  # dependency set of all four ecosystems the repository ships: the Python
  # workspace, the Studio's npm packages, and the Tauri shell's Cargo tree.
  # Accepted advisories live in security/audit-ignore.toml with an expiry date,
  # and scripts/audit_ignore.py is the gate on that ledger (#1090).
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: The ignore ledger is current
        run: uv run python scripts/audit_ignore.py --check

      # --no-dev: a dev-only advisory is Dependabot's to update, not a reason to
      # fail a build. The workspace members are skipped by pip-audit because
      # they are not on PyPI; the third-party set is what is audited.
      - name: Audit the Python runtime dependencies
        run: |
          uv export --all-packages --format requirements-txt --no-hashes --no-dev > "$RUNNER_TEMP/req.txt"
          ignore="$(uv run python scripts/audit_ignore.py --pip-args)"
          # shellcheck disable=SC2086
          uvx pip-audit==2.7.3 -r "$RUNNER_TEMP/req.txt" --skip-editable $ignore

      - name: Audit the Studio npm dependencies
        run: |
          npm --prefix apps/studio audit --omit=dev --json > "$RUNNER_TEMP/npm-audit.json" || true
          uv run python scripts/audit_ignore.py --npm-json "$RUNNER_TEMP/npm-audit.json"

      - name: Install cargo-audit
        # 0.22.0 is the first release that can parse the CVSS 4.0 vectors the
        # RustSec database started carrying; 0.21.2 fails to load the database
        # with "unsupported CVSS version: 4.0".
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit the Tauri Cargo dependencies
        run: |
          ignore="$(uv run python scripts/audit_ignore.py --cargo-args)"
          # shellcheck disable=SC2086
          cargo audit --file apps/studio/src-tauri/Cargo.lock $ignore

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # The protected-files contract diffs the branch against its base, so this
      # job needs the parent commit, not a one-commit shallow checkout.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Pytest
        run: |
          uv run pytest \
            --cov=agentic_odi_cli \
            --cov=agentic_odi_connectors \
            --cov=agentic_odi_core \
            --cov=agentic_odi_mcp_server \
            --cov=agentic_odi_studio_api \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

      # One upload per run is enough; the 3.12 report is the canonical one.
      # The token is not available to Dependabot or fork runs, so the upload is
      # skipped there -- loudly, in the log and the job summary, instead of
      # passing silently behind `fail_ci_if_error: false`.
      - name: Check whether coverage can be uploaded
        id: codecov
        if: ${{ matrix.python-version == '3.12' }}
        env:
          TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CODECOV_TOKEN is not available to this run (Dependabot or fork). Coverage was produced but not uploaded, so the 90% project floor was not enforced for this commit."
            {
              echo "## Coverage"
              echo ""
              echo "The floor in \`codecov.yml\` was **not enforced** for this commit: this run had no CODECOV_TOKEN."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage to Codecov
        if: ${{ matrix.python-version == '3.12' && steps.codecov.outputs.available == 'true' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true

  smoke:
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, security, test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: CLI reports a version
        run: |
          version="$(uv run python -m agentic_odi_cli --version)"
          [ -n "$version" ]
          echo "OK: $version"

      - name: CLI exposes connectors commands
        run: |
          help="$(uv run python -m agentic_odi_cli connectors --help)"
          echo "$help" | grep -q list
          echo "$help" | grep -q ingest
          echo "OK: connectors help"

      - name: Installer installs from a simulated release
        run: bash scripts/tests/install_e2e.sh

      # The updater's second-launch wait, guarded without a 40-minute build: the
      # poll, the process-state report, and the feed log the wait reads. The full
      # proof runs at the release (tauri-release.yml `updater-proof`), which is
      # where a wrong answer can still stop a ship.
      - name: The updater waits for the second launch instead of sleeping
        run: bash scripts/tests/desktop_update_wait_e2e.sh

      - name: MCP server boots and serves /mcp
        run: |
          uv run python -m agentic_odi_mcp_server > /tmp/mcp_server.log 2>&1 &
          SERVER_PID=$!
          probe() {
            curl -sfX POST http://localhost:8000/mcp \
              -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","method":"initialize","id":1,"params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
              -o /dev/null
          }
          ok=0
          for _ in $(seq 1 30); do
            if probe; then ok=1; break; fi
            sleep 1
          done
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then
            echo "MCP server did not respond on :8000/mcp"
            cat /tmp/mcp_server.log
            exit 1
          fi
          echo "OK: MCP server responded with 200"

      - name: Living Studio sidecar serves the studio API
        run: |
          AGENTIC_ODI_BACKEND=mcp uv run python -m agentic_odi_studio_api.main > /tmp/sidecar.log 2>&1 &
          SIDECAR_PID=$!
          # The sidecar issues a per-install bearer token on first boot; every
          # /api route requires it, so the probe reads the same file the app uses.
          TOKEN_FILE="${AGENTIC_ODI_STUDIO_TOKEN:-$HOME/.config/agentic-odi/studio-token}"
          for _ in $(seq 1 30); do [ -s "$TOKEN_FILE" ] && break; sleep 1; done
          TOKEN="$(cat "$TOKEN_FILE")"
          probe() {
            curl -fsS -X POST http://127.0.0.1:8100/api/health/mcp \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' \
              -d '{"mcp_url":"http://127.0.0.1:8000/mcp"}' -o /dev/null &&
              curl -fsS -H "Authorization: Bearer $TOKEN" \
                "http://127.0.0.1:8100/api/canvas?mcp_url=http://127.0.0.1:8000/mcp" -o /dev/null
          }
          ok=0
          for _ in $(seq 1 30); do
            if probe; then ok=1; break; fi
            sleep 1
          done
          kill "$SIDECAR_PID" 2>/dev/null || true
          wait "$SIDECAR_PID" 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then
            echo "Living Studio sidecar did not respond on :8100"
            cat /tmp/sidecar.log
            exit 1
          fi
          echo "OK: sidecar studio API responded with 200"

      - name: scripts/dev.py brings up both services and stops cleanly
        run: |
          uv run python scripts/dev.py > /tmp/clientrun.log 2>&1 &
          RUN_PID=$!
          # The earlier sidecar step already minted the per-install token, so the
          # MCP server started here gates /mcp as well: both probes send it.
          TOKEN_FILE="${AGENTIC_ODI_STUDIO_TOKEN:-$HOME/.config/agentic-odi/studio-token}"
          for _ in $(seq 1 60); do [ -s "$TOKEN_FILE" ] && break; sleep 1; done
          TOKEN="$(cat "$TOKEN_FILE")"
          probe() {
            curl -sf -H "Authorization: Bearer $TOKEN" -o /dev/null http://127.0.0.1:8100/api/config &&
              curl -sfX POST http://127.0.0.1:8000/mcp \
                -H "Authorization: Bearer $TOKEN" \
                -H 'Content-Type: application/json' \
                -d '{"jsonrpc":"2.0","method":"initialize","id":1,"params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
                -o /dev/null
          }
          ok=0
          for _ in $(seq 1 60); do
            if probe; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            echo "scripts/dev.py did not bring up both services"
            cat /tmp/clientrun.log
            kill "$RUN_PID" 2>/dev/null || true
            exit 1
          fi
          kill -INT "$RUN_PID"
          wait "$RUN_PID"
          echo "OK: both services stopped cleanly"

  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # The site is generated from the repository's own sources and built in CI;
      # no committed copy exists. If a fresh build fails, the PR is not ready.

      - name: Pytest (website)
        run: uv run --directory website pytest tests/

      - name: Build site
        run: uv run python website/tools/build_site.py --out _site

      - name: Upload built site for review
        uses: actions/upload-artifact@v7
        with:
          name: website-site
          path: _site
          if-no-files-found: error

  studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Check the cold-start bundle budget
        working-directory: .
        run: node scripts/check_bundle_budget.mjs

      - name: Verify generated API types are up to date
        run: |
          npm run gen:api-types
          git diff --exit-code -- src/api/schema.d.ts

  # Contrast as a build gate (issue #543, parent #331). A pair that drops below
  # AA, or a screen that paints a pair not on the known list, fails here instead
  # of waiting for review. It is its own job rather than a step in `e2e` because
  # `e2e` is advisory (`continue-on-error`) and slower; this one must block a
  # merge. It needs the same browser and built Studio as `e2e`.
  #
  # The run is bounded: only `a11y.spec.ts` runs, and it is the deterministic
  # part of the browser suite — no chat, no model, no LLM.
  contrast:
    name: Contrast gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the Studio
        run: npm run build

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run the contrast gate
        run: npm run test:e2e -- a11y.spec.ts

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contrast-report
          path: apps/studio/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # Component snapshots are published by `chromatic.yml`, which runs on push.
  # Chromatic recommends push over pull_request because a PR run checks out an
  # ephemeral merge commit that diffs against the wrong baseline.

  # The browser-level suite. It drives the real Studio against the real
  # sidecar and MCP server, so it is slower than the other jobs and can be
  # flakier than a unit test.
  #
  # It stays advisory at merge time, but it is no longer silent. The suite
  # writes a machine-readable report, this job names the failing specs in the
  # run summary and in a warning annotation, and `ci-green` prints the outcome
  # in its table instead of folding it into a generic result.
  #
  # Set the repository variable AGENTIC_ODI_E2E_BLOCKING to "true" to make a
  # failure block the merge once the suite is green across a week of main runs.
  #
  # Two ways to turn it off, neither of which needs a code change:
  #   - set the repository variable AGENTIC_ODI_E2E to "false"
  #   - remove the continue-on-error below
  # A skipped e2e job does not fail CI green; see the ci-green job.
  e2e:
    name: End-to-end
    if: ${{ vars.AGENTIC_ODI_E2E != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The lane is non-blocking on purpose, so this flag stays. What changed is
    # that the suite's own outcome is published as an output: with a job-level
    # `continue-on-error`, `needs.<job>.result` is always `success`, which is how
    # a red browser suite went unnoticed. A step outcome is not coerced that way.
    continue-on-error: true
    outputs:
      suite: ${{ steps.suite.outcome || 'not-run' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      - name: Install dependencies
        working-directory: apps/studio
        run: npm ci

      - name: Build the Studio
        working-directory: apps/studio
        run: npm run build

      - name: Install the browser
        working-directory: apps/studio
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end suite
        id: suite
        working-directory: apps/studio
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results.json
        run: npm run test:e2e -- --reporter=list,html,json

      - name: Summarize the end-to-end outcome
        if: always()
        working-directory: apps/studio
        run: |
          node - <<'NODE'
          const fs = require("node:fs");

          const REPORT = "e2e-results.json";
          const lines = ["## End-to-end suite", ""];
          let passed = 0;
          let failed = 0;
          let flaky = 0;
          let skipped = 0;
          const failures = [];

          function walk(suites) {
            for (const suite of suites || []) {
              for (const spec of suite.specs || []) {
                for (const test of spec.tests || []) {
                  const results = test.results || [];
                  const last = results[results.length - 1] || {};
                  if (test.status === "expected") {
                    passed += 1;
                  } else if (test.status === "flaky") {
                    flaky += 1;
                  } else if (test.status === "skipped") {
                    skipped += 1;
                  } else {
                    failed += 1;
                    const message =
                      (last.error && last.error.message
                        ? last.error.message
                        : "no error message"
                      )
                        .split("\n")[0]
                        .slice(0, 300);
                    failures.push(spec.title + " -- " + message);
                  }
                }
              }
              walk(suite.suites);
            }
          }

          if (!fs.existsSync(REPORT)) {
            lines.push(
              "No JSON report was written, so the suite never reached the reporter: " +
                "dependency install, the Studio build or the browser install failed " +
                "before a test ran.",
            );
          } else {
            try {
              walk(JSON.parse(fs.readFileSync(REPORT, "utf8")).suites);
              lines.push("- passed: **" + passed + "**");
              lines.push("- failed: **" + failed + "**");
              lines.push("- flaky (passed on retry): **" + flaky + "**");
              lines.push("- skipped: **" + skipped + "**");
              lines.push("");
              if (failures.length > 0) {
                lines.push("### Failing specs", "");
                for (const failure of failures) {
                  lines.push("- " + failure);
                }
              }
            } catch (error) {
              lines.push("The JSON report could not be read: " + error.message);
            }
          }

          for (const failure of failures.slice(0, 10)) {
            const message = failure.replace(/[\r\n]+/g, " ").replace(/::/g, ":");
            console.log("::warning title=End-to-end::" + message.slice(0, 400));
          }
          const summary = process.env.GITHUB_STEP_SUMMARY;
          if (summary) {
            fs.appendFileSync(summary, lines.join("\n") + "\n");
          }
          console.log(lines.join("\n"));
          NODE

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/studio/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the machine-readable results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: apps/studio/e2e-results.json
          if-no-files-found: warn
          retention-days: 7

  # The product's most common first run: no sidecar. This job is required —
  # there is no continue-on-error and no repository variable that can skip it —
  # because a refactor that deletes the browser fallback must turn CI red.
  e2e-no-sidecar:
    name: End-to-end (no sidecar)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      - name: Install dependencies
        working-directory: apps/studio
        run: npm ci

      - name: Build the Studio
        working-directory: apps/studio
        run: npm run build

      - name: Install the browser
        working-directory: apps/studio
        run: npx playwright install --with-deps chromium

      - name: Run the suite with /api dead
        working-directory: apps/studio
        run: npm run test:e2e:no-sidecar

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-no-sidecar-report
          path: apps/studio/playwright-report
          if-no-files-found: ignore

  tauri-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: apps/studio/src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/studio/src-tauri -> target

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo clippy
        run: cargo clippy -- -D warnings

      - name: Cargo check
        run: cargo check

  tauri-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/studio/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/studio

      # Dependabot PRs cannot read repository secrets, so the signing key is
      # empty there. Export it only when present and disable updater artifacts
      # otherwise; passing an empty key makes the bundler try (and fail) to
      # decode it.
      - name: Build desktop bundle
        working-directory: apps/studio
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$SIGNING_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$SIGNING_KEY_PASSWORD"
            npm run tauri -- build
          else
            echo "No TAURI_SIGNING_PRIVATE_KEY provided — building without signed updater artifacts."
            npm run tauri -- build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v7
        with:
          name: tauri-bundles-linux
          if-no-files-found: warn
          path: |
            apps/studio/src-tauri/target/release/bundle/deb/*.deb
            apps/studio/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/studio/src-tauri/target/release/bundle/appimage/*.AppImage.sig

  # Weekly proof that the shipped updater actually updates: builds signed
  # 0.1.0 and 0.2.0 AppImages against a local feed and watches 0.1.0 replace
  # its own file. Runs on schedule/dispatch only, deliberately outside
  # `ci-green`'s needs — a schedule-gated job would report `skipped` on every
  # PR and break the all-results-success aggregate (same treatment as
  # `pr-body`). This is the early warning; the result a release answers to is
  # the same script run at the tag by `updater-proof` in
  # .github/workflows/tauri-release.yml, which `build` waits for (#613). No
  # repository secret is used: the script generates a throwaway minisign key
  # per run, and the committed updater public key is untouched.
  updater-e2e:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install webview, AppImage, and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libfuse2 xvfb

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/studio/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/studio

      - name: Prove the updater end to end
        env:
          # GitHub runners have no FUSE daemon; extract-and-run also keeps the
          # on-disk AppImage as the updater's replacement target.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: xvfb-run -a bash scripts/verify-desktop-update.sh

      - name: Upload the run logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: updater-e2e-log
          if-no-files-found: ignore
          path: /tmp/studio-update-e2e/

  # Production deploys on every push to main, and a merged PR is not proof the
  # change reached the branch that deploys. This knocks on the real URL and reports
  # one dated line per promise the README makes a visitor. It sits outside
  # `ci-green`'s `needs:` for the same reason `pr-body` and `updater-e2e` do: a
  # broken deploy is news about the deploy, not about the pull request that
  # happened to share the branch, and a suite that is green over a branch nobody
  # deploys is exactly how #492 and #609 went unnoticed.
  hosted-first-run:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Probe the hosted first run
        run: |
          set +e
          bash scripts/verify-hosted-first-run.sh --commit "$(git rev-parse HEAD)" \
            | tee /tmp/hosted-first-run.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::the hosted first run broke; the dated lines are in the hosted-first-run-log artifact"
            exit "$status"
          fi

      - name: Upload the probe output on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-first-run-log
          if-no-files-found: ignore
          path: /tmp/hosted-first-run.log

  ci-green:
    name: CI green
    runs-on: ubuntu-latest
    needs: [lint, typecheck, security, test, smoke, website, studio, contrast, tauri-check, tauri-build, e2e, e2e-no-sidecar, dependencies]
    if: always()
    steps:
      - name: Verify the required jobs and report what was verified
        env:
          # The no-sidecar job is required: it carries no continue-on-error, so
          # a regression in the browser fallback must fail this aggregate.
          E2E_NO_SIDECAR: ${{ needs.e2e-no-sidecar.result }}
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          SECURITY: ${{ needs.security.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
          TEST: ${{ needs.test.result }}
          SMOKE: ${{ needs.smoke.result }}
          WEBSITE: ${{ needs.website.result }}
          STUDIO: ${{ needs.studio.result }}
          CONTRAST: ${{ needs.contrast.result }}
          TAURI_CHECK: ${{ needs.tauri-check.result }}
          TAURI_BUILD: ${{ needs.tauri-build.result }}
          # The browser suite is the one lane allowed to be red without blocking
          # a merge. `E2E_JOB` tells us whether the job was skipped; the suite's
          # own outcome is `E2E_SUITE`, which the job-level continue-on-error hid
          # behind a coerced `success`.
          E2E_JOB: ${{ needs.e2e.result }}
          E2E_SUITE: ${{ needs.e2e.outputs.suite }}
          E2E_BLOCKING: ${{ vars.AGENTIC_ODI_E2E_BLOCKING }}
        run: |
          failed=0
          for job in LINT TYPECHECK SECURITY DEPENDENCIES TEST SMOKE WEBSITE STUDIO CONTRAST TAURI_CHECK TAURI_BUILD E2E_NO_SIDECAR; do
            result="${!job}"
            if [ "$result" != "success" ]; then
              echo "::error::$job did not succeed ($result)"
              failed=1
            fi
          done

          if [ "$E2E_JOB" = "skipped" ]; then
            e2e_state="skipped"
          elif [ "$E2E_SUITE" = "success" ]; then
            e2e_state="passed"
          elif [ "$E2E_SUITE" = "failure" ]; then
            e2e_state="suite failed"
          else
            e2e_state="did not report (install, build or browser failed first)"
          fi

          case "$e2e_state" in
            passed|skipped)
              ;;
            *)
              if [ "$E2E_BLOCKING" = "true" ]; then
                echo "::error::the browser suite $e2e_state, and AGENTIC_ODI_E2E_BLOCKING is true"
                failed=1
              else
                echo "::warning::the browser suite $e2e_state. It is advisory, so this run still passes, but it is reported here and in the job summary so it cannot go unnoticed."
              fi
              ;;
          esac

          {
            echo "## CI verification"
            echo ""
            echo "| Check | Result | Gate |"
            echo "| --- | --- | --- |"
            printf '| %s | %s | %s |\n' lint "$LINT" required
            printf '| %s | %s | %s |\n' typecheck "$TYPECHECK" required
            printf '| %s | %s | %s |\n' security "$SECURITY" required
            printf '| %s | %s | %s |\n' "test (3.10-3.12)" "$TEST" required
            printf '| %s | %s | %s |\n' smoke "$SMOKE" required
            printf '| %s | %s | %s |\n' website "$WEBSITE" required
            printf '| %s | %s | %s |\n' studio "$STUDIO" required
            printf '| %s | %s | %s |\n' "contrast gate" "$CONTRAST" required
            printf '| %s | %s | %s |\n' tauri-check "$TAURI_CHECK" required
            printf '| %s | %s | %s |\n' tauri-build "$TAURI_BUILD" required
            printf '| %s | %s | %s |\n' "e2e (browser)" "$e2e_state" "$( [ "$E2E_BLOCKING" = "true" ] && echo required || echo advisory )"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "OK: every required job succeeded; advisory lanes are listed above."
