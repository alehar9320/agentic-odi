name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-packages --locked

      - name: Run Ruff Lint (no formatting)
        # Lint Python files without changing them
        run: uv run ruff check .

      - name: Verify Ruff Formatting (no auto-fix)
        # Verify formatting only; run `uv run ruff format .` locally to fix before pushing
        run: uv run ruff format --check .

      - name: Run Mypy (server)
        run: uv run --directory server mypy .

      - name: Run Mypy (client)
        run: uv run --directory client mypy .

      - name: Run Mypy (cli)
        run: uv run --directory cli mypy .

      - name: Run Bandit
        run: uv run bandit -c pyproject.toml -r cli/src client/src server/src

      - name: Run Server Tests
        run: uv run --directory server pytest

      - name: Run Client Tests
        run: uv run --directory client pytest

      - name: Run CLI Tests
        run: uv run --directory cli pytest
