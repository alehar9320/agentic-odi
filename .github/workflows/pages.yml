name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing needs `pages: write` and an OIDC token so the deploy can be
# attributed to this workflow run.
permissions:
  contents: read
  pages: write
  id-token: write

# Pages allows one deployment at a time. Never cancel a run mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Gate the deploy on the site contract so a broken page never goes live.
      - name: Pytest (website)
        run: uv run --directory website pytest tests/

      # The site is generated from the repository's own sources, so it is
      # built here rather than copied. website/dist/ is the committed copy a
      # reviewer reads; this step produces the artifact that goes live.
      - name: Build site
        run: uv run python website/tools/build_site.py --out _site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
