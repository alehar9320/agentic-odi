[project]
name = "agentic-odi-connectors"
version = "0.15.0"
description = "External system connectors for Agentic ODI, including an MCP client ingest connector, REST item previews, and delivery write-back to Linear, GitHub, and Jira."
requires-python = ">=3.10"
dependencies = [
    "fastmcp",
    "httpx",
    "pydantic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_odi_connectors"]
