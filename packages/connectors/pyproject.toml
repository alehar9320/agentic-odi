[project]
name = "agentic-odi-connectors"
version = "0.13.0"
description = "External system connectors for Agentic ODI, including an MCP client ingest connector."
requires-python = ">=3.10"
dependencies = [
    "fastmcp",
    "pydantic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_odi_connectors"]
