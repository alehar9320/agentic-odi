[project]
name = "agentic-odi-core"
version = "0.14.0"
description = "Core domain models, services, and repositories for Agentic ODI."
requires-python = ">=3.10"
dependencies = [
    "pydantic",
]

[project.optional-dependencies]
# Reading an .xlsx is optional: the core package is imported by the MCP server, the
# sidecar, the CLI and every test, and a spreadsheet library in that path is a
# dependency nobody asked for until they hand over a workbook.
xlsx = ["openpyxl>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_odi_core"]
