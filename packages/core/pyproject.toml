[project]
name = "agentic-odi-core"
version = "0.12.0"
description = "Core domain models, services, and repositories for Agentic ODI."
requires-python = ">=3.10"
dependencies = [
    "pydantic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_odi_core"]
