[project]
name = "agentic-odi-openhands"
version = "0.14.0"
description = "Thin OpenHands Cloud and Agent Server HTTP client used by the ODI orchestrator."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "pydantic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_odi_openhands"]
