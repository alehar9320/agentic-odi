[project]
name = "agentic-odi-cli"
version = "0.1.0"
description = "Command-line interface for Agentic ODI."
requires-python = ">=3.10"
dependencies = [
    "typer",
    "fastmcp",
]

[project.scripts]
agentic-odi = "cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
