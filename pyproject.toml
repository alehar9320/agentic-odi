[project]
name = "agentic-odi"
version = "0.1.0"
description = "Outcome-Driven Innovation (ODI): an MCP server, chat client, CLI, and external connectors."
requires-python = ">=3.10"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["cli", "client", "connectors", "core", "mcp_server", "local_server"]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "mypy==2.4.0",
    "pyinstaller==6.22.3",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.0",
]

[tool.bandit]
exclude_dirs = [".venv", "tests"]

[tool.ruff]
# Vendored Superpowers skills are third-party content. Their Markdown code
# fences are examples, not project Python, so Ruff must not lint or reformat
# them (and `npx skills update` would overwrite any local edits anyway).
extend-exclude = [".agents/skills"]
