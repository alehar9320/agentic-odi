[project]
name = "agentic-odi"
version = "0.1.0"
description = "Outcome-Driven Innovation (ODI): an MCP server, chat client, CLI, and external connectors."
requires-python = ">=3.10"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/cli",
    "apps/mcp-server",
    "apps/studio-api",
    "packages/connectors",
    "packages/core",
]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "mypy==2.4.0",
    "pyinstaller==6.22.3",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
    "pillow==12.3.0",
]

[tool.bandit]
exclude_dirs = [".venv", "tests", ".worktrees", "node_modules"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Vendored Superpowers skills are third-party content. Their Markdown code
# fences are examples, not project Python, so Ruff must not lint or reformat
# them (and `npx skills update` would overwrite any local edits anyway).
# Implementation plans under docs/superpowers/plans/ are documentation specs
# containing illustrative code fences, not production Python modules, so they
# are excluded from lint/format as well.
extend-exclude = [".agents/skills", ".worktrees", "docs/superpowers/plans"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
disable_error_code = ["prop-decorator"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = [".", "brand/src"]
testpaths = ["apps", "brand", "packages", "tests", "website"]

[tool.coverage.run]
source = [
    "agentic_odi_cli",
    "agentic_odi_connectors",
    "agentic_odi_core",
    "agentic_odi_mcp_server",
    "agentic_odi_studio_api",
]
