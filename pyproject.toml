[project]
name = "agentic-odi"
version = "0.1.0"
description = "Outcome-Driven Innovation (ODI): an MCP server, chat client, and CLI."
requires-python = ">=3.10"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["cli", "client", "server"]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.0",
]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
