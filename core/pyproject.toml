[project]
name = "agentic-odi-core"
version = "0.1.0"
description = "Core domain models, services, and repositories for Agentic ODI."
requires-python = ">=3.11"
dependencies = [
    "pydantic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
