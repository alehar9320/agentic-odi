<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Evidence — decision brief</title>
  </head>
  <body>
    <main id="main">
      <h1>Payments platform</h1>
      <h2>Evidence</h2>
      <svg role="img" aria-label="Opportunity by band: 6 outcomes in the quick wins band, 2 in the money pit band." viewBox="0 0 12 8">
        <rect x="0" y="0" width="6" height="8"></rect>
      </svg>
      <table>
        <caption>Opportunity scores by band, from 12 interviews and 1 survey.</caption>
        <thead>
          <tr><th scope="col">Band</th><th scope="col">Outcomes</th><th scope="col">Method</th><th scope="col">Sample size</th></tr>
        </thead>
        <tbody>
          <tr><td>Quick win</td><td>6</td><td>Interview score</td><td>12</td></tr>
          <tr><td>Money pit</td><td>2</td><td>Interview score</td><td>12</td></tr>
          <tr><td>Not scored</td><td>4</td><td>No answer recorded</td><td>12</td></tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
