[project]
name = "agentic-odi-mcp-server"
version = "0.1.0"
description = "FastMCP server for Agentic ODI."
requires-python = ">=3.10"
dependencies = [
    "fastmcp",
    "pydantic",
    "agentic-odi-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[project.scripts]
agentic-odi-server = "mcp_server.mcp_server:main"
agentic-odi-mcp-server = "mcp_server.mcp_server:main"
